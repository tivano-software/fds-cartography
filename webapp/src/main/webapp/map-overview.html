<!doctype html>
<html>
<header>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <script type='text/javascript' src='js/knockout.js'></script>
    <script src="js/require.js"></script>
    <script src="index.js"></script>
    <title>Karten&uuml;bersicht</title>
</header>

<body>
    <custom-navbar params="messages: messages"></custom-navbar>
    <div class="container">
        <div class="row py-4">
            <div class="col-sm-6">
                <h1 class="h1">&Uuml;bersicht der Karten</h1>
            </div>
        </div>
        <custom-messagebar params="messages: messages"></custom-messagebar>

        <fieldset>
            <form action="javascript:controller.search()">
                <div class="row">
                    <div class="col-auto">
                        <h5>Suche</h5>
                    </div>
                    <div class="col-auto">
                        <div class="input-group mb-3">
                            <input class="form-control" type="text" data-bind="value: searchInput">
                            <button class="btn btn-outline-secondary" type="submit">Suche</button>
                        </div>
                    </div>
                    <div class="form-text">
                        Die Gro&szlig;- und Kleinschreibung wird bei der Suche ignoriert. Es ist auch eine Suche basierend auf den Spalten m&ouml;glich. Syntax:<br/>
                        key:value<br/>
                        key:value;key:value;...<br/>
                        value<br/>
                        value;value;value;...<br/>
                        Es stehen folgende keys zur Auswahl: id, title, editor, creator.
                    </div>
                </div>
            </form>
        </fieldset>

        <table class="table">
            <thead>
                <tr>
                    <th scope="col">
                        <button type="submit" class="btn btn-secondary btn-sm"
                            data-bind="click: function() {controller.toggleSort('id')}">
                            #
                        </button>
                    </th>
                    <th scope="col">
                        <button type="submit" class="btn btn-secondary btn-sm"
                            data-bind="click: function() {controller.toggleSort('title')}">
                            Name
                        </button>
                    </th>
                    <th scope="col">
                        <button type="submit" class="btn btn-secondary btn-sm"
                            data-bind="click: function() {controller.toggleSort('editor')}">
                            Letzter Bearbeiter
                        </button>
                    </th>
                    <th scope="col">
                        <button type="submit" class="btn btn-secondary btn-sm"
                            data-bind="click: function() {controller.toggleSort('creator')}">
                            Initialer Bearbeiter
                        </button>
                    </th>
                    <th scope="col">
                        <button type="submit" class="btn btn-secondary btn-sm"
                            data-bind="click: function() {controller.toggleSort('lastEdited')}">
                            Zuletzt bearbeitet
                        </button>
                    </th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody data-bind="foreach: list.getPrepared">
                <tr>
                    <td data-bind="text: id"></td>
                    <td>
                        <a data-bind="attr: { href: '/map.html?configId=' + id(), title: title }">
                            <span data-bind="text: title"></span>
                        </a>
                    </td>
                    <td data-bind="text: lastEditor"></td>
                    <td data-bind="text: initialAuthor"></td>
                    <td data-bind="text: lastEditedAt().toLocaleString()"></td>
                    <td>
                        <div class="btn-group" role="group">
                            <button class="btn btn-primary btn-sm" data-bind="click: function() {controller.copy($data)}">
                                <i class="bi bi-files"></i>
                            </button>
                            <button class="btn btn-danger btn-sm" data-bind="click: function() {controller.delete($data)}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <paging-toolbar params="list: list"></paging-toolbar>



    </div>

    <script>
        var controller;

        require(['pages/generic-config/index'],
            function (Overview) {
                Overview.registerComponents(ko);
                var observable = Overview.createConfigObervable(ko);
                controller = Overview.createConfigControllerMap(ko, observable);
                controller.initItems();
                ko.applyBindings(observable);
            }
        );


    </script>
</body>

</html>
