<!doctype html>
<html>
<header>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <script type='text/javascript' src='js/knockout.js'></script>
    <script src="js/require.js"></script>
    <script src="index.js"></script>
    <title>Nutzer&uuml;bersicht</title>
</header>

<body>
    <custom-navbar params="messages: messages"></custom-navbar>
    <div class="container">
        <h1 class="h1" data-bind="text: title"></h1>
        <h1 class="h2">Nutzer&uuml;bersicht</h1>
        <custom-messagebar params="messages: messages"></custom-messagebar>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">E-Mail</th>
                    <th scope="col">Rollen</th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody data-bind="foreach: users.getPrepared">
                <tr>
                    <td data-bind="text: id"></td>
                    <td data-bind="text: email"></td>
                    <td>
                        <span data-bind="foreach: rolesAll">
                            <input class="form-check-input" type="checkbox" data-bind="checked: $data.checked" id="role">
                            <label class="form-check-label" for="role">
                                <span data-bind="text: $data.role"></span>
                            </label>
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-danger btn-sm" data-bind="click: function() {controller.deleteUser($data)}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        <paging-toolbar params="list: users"></paging-toolbar>

        <h1 class="h2">Neuen Nutzer anlegen</h1>
        <fieldset>
            <div class="mb-3">
                <label for="emailInput" class="form-label">E-Mail Adresse</label>
                <input
                    data-bind="value: createUser.email"
                    type="email"
                    class="form-control"
                    id="emailInput"
                    placeholder="name@example.com"
                >
            </div>
            <button type="submit" class="btn btn-primary" onclick="controller.submitNewUser()">
                Hinzuf&uuml;gen
            </button>
        </fieldset>

    </div>



    <script>
        var controller;

        require(['pages/user-administration/index'],
            function (UserAdministration) {
                UserAdministration.registerComponents(ko);
                var observable = UserAdministration.createUserAdministration(ko);
                controller = UserAdministration.userAdministrationControllerOf(observable);
                controller.init();
                ko.applyBindings(observable);
            }
        );
    </script>
</body>

</html>
